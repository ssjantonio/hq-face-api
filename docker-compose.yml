services:
  face-api:
    build:
      context: .
    container_name: hidraquim-face-api
    restart: unless-stopped
    environment:
      UPLOADS_DIR: /app/uploads
    volumes:
      - ./uploads:/app/uploads
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
